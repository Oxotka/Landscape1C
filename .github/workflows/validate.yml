# Проверки данных, регрессионные тесты и сборка на PR и push.
name: Validate data

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate catalog
        run: node scripts/validate.js
      - name: Validate survey bot
        run: node bot/validate.js
      - name: Run regression tests
        run: node --test bot/test/*.test.js tests/*.test.js
      - name: Build public site
        run: node scripts/build.js
